<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion · RF Engineering 2.0</title>
<style>
:root{--bg:#070b14;--card:#0f1524;--accent:#00d4ff;--accent2:#7c3aed;--text:#e6edf7;--muted:#94a3b8;--border:#1f2a44;--danger:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 15% 20%,rgba(0,212,255,.1),transparent 45%),radial-gradient(circle at 85% 80%,rgba(124,58,237,.1),transparent 45%)}
.card{background:linear-gradient(145deg,var(--card),#141b2e);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.logo{font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:32px}
h1{font-size:1.2rem;font-weight:700;margin-bottom:20px;color:#fff;text-align:center}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase}
input{width:100%;padding:12px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:.95rem;margin-bottom:18px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,212,255,.25)}
button:disabled{opacity:.6;cursor:wait}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:18px;display:none}
.error.visible{display:block}
.footer{text-align:center;margin-top:20px;font-size:.85rem;color:var(--muted)}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📡 RF Engineering 2.0</div>
  <div class="subtitle">Dashboard de monitoring RF</div>
  <h1>Connexion</h1>
  <div id="error" class="error"></div>
  <form id="loginForm">
    <label>Email</label>
    <input type="email" id="email" required placeholder="vous@exemple.com">
    <label>Mot de passe</label>
    <input type="password" id="password" required placeholder="••••••••">
    <button type="submit" id="submitBtn">Se connecter</button>
  </form>
  <div class="footer">Pas encore de compte ? <a href="/signup.html">Créer un compte</a></div>
</div>
<script>
const TOKEN_KEY="rf_token";
function saveToken(t){localStorage.setItem(TOKEN_KEY,t)}
function getToken(){return localStorage.getItem(TOKEN_KEY)}
function isLoggedIn(){return !!getToken()}
if(isLoggedIn()){window.location.href="/"}
const form=document.getElementById("loginForm");
const errorBox=document.getElementById("error");
const submitBtn=document.getElementById("submitBtn");
form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  errorBox.classList.remove("visible");
  submitBtn.disabled=true;
  submitBtn.textContent="Connexion...";
  try{
    const fd=new URLSearchParams();
    fd.append("username",document.getElementById("email").value.trim());
    fd.append("password",document.getElementById("password").value);
    const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:fd});
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.detail||"Erreur de connexion")}
    const data=await res.json();
    saveToken(data.access_token);
    window.location.href="/";
  }catch(err){
    errorBox.textContent="❌ "+err.message;
    errorBox.classList.add("visible");
    submitBtn.disabled=false;
    submitBtn.textContent="Se connecter";
  }
});
</script>
</body>
</html>
